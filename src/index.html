<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: cascade: data: blob:; media-src 'self' file: cascade: blob: http: https:; img-src 'self' file: cascade: data: blob:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; connect-src 'self' file: cascade:">
  <title>Cascade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"><div class="bd" id="bd1"></div><div class="bd" id="bd2"></div><div class="glow"></div><div class="scrim"></div></div>

  <header id="top">
    <div class="logo"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="brand"><b>Cascade</b><span id="count">Loading…</span></div>
    <label class="search"><svg viewBox="0 0 24 24"><path id="i-search"/></svg><input id="q" placeholder="Search your library" spellcheck="false"></label>
    <div class="tabs" id="tabs">
      <span class="ind" id="ind"></span>
      <button data-tab="videos" class="on">Videos</button>
      <button data-tab="folders">Folders</button>
      <button data-tab="audio">Audio</button>
    </div>
    <div class="actions">
      <div class="dd"><button class="gbtn" id="btn-add" title="Add"><svg viewBox="0 0 24 24"><path data-i="add"/></svg></button>
        <div class="menu" id="menu-add">
          <button data-do="add-folder">Add folder to library…</button>
          <button data-do="manage-folders">Manage library folders</button>
          <button data-do="open-files">Open file(s)…</button>
          <button data-do="open-url">Play network URL…</button>
        </div></div>
      <div class="dd"><button class="gbtn" id="btn-sort" title="Sort"><svg viewBox="0 0 24 24"><path data-i="sort"/></svg></button>
        <div class="menu" id="menu-sort">
          <button data-sort="new">Newest</button><button data-sort="name">Name</button><button data-sort="dur">Duration</button><button data-sort="size">Size</button>
        </div></div>
      <button class="gbtn" id="btn-theme" title="Theme"><svg viewBox="0 0 24 24"><path id="theme-icon"/></svg></button>
    </div>
  </header>

  <main id="home"><div id="content"></div></main>
  <button id="fab" title="Play last played" hidden><svg viewBox="0 0 24 24"><path data-i="play"/></svg></button>

  <section id="player" hidden>
    <div id="stage">
      <video id="video" crossorigin="anonymous" preload="auto"></video>
      <div id="audioart"><div class="logo big"><i></i><i></i><i></i><i></i><i></i><i></i></div><h2 id="atitle"></h2></div>
      <div class="ripple l" id="rip-l"><svg viewBox="0 0 24 24"><path data-i="rew"/></svg><b></b></div>
      <div class="ripple r" id="rip-r"><svg viewBox="0 0 24 24"><path data-i="fwd"/></svg><b></b></div>
      <div id="gauge"><i></i><span></span></div>
      <div id="boost">2x speed</div>
      <div id="sysmini"></div>
    </div>
    <div class="shade top"></div><div class="shade bot"></div>

    <div class="ctl topbar">
      <button class="gbtn dark" id="p-back" title="Back (Esc)"><svg viewBox="0 0 24 24"><path data-i="back"/></svg></button>
      <div class="ttl"><b id="ptitle"></b><span id="psub"></span></div>
      <div class="pill">
        <button id="p-shot" title="Screenshot (S)"><svg viewBox="0 0 24 24"><path data-i="camera"/></svg></button>
        <button id="p-audio" title="Play as audio"><svg viewBox="0 0 24 24"><path data-i="headphones"/></svg></button>
        <button id="p-pip" title="Picture in picture"><svg viewBox="0 0 24 24"><path data-i="pip"/></svg></button>
        <button id="p-aspect" title="Aspect ratio (A)"><svg viewBox="0 0 24 24"><path data-i="aspect"/></svg></button>
      </div>
    </div>

    <div class="ctl center">
      <button class="gbtn dark" id="p-prev" title="Previous (P)"><svg viewBox="0 0 24 24"><path data-i="prev"/></svg></button>
      <button class="gbtn dark big skip" id="p-rew" title="Back"><svg viewBox="0 0 24 24"><path data-i="rew"/></svg><b></b></button>
      <button class="playbtn" id="p-play" title="Play / pause (Space)"><svg viewBox="0 0 24 24"><path id="play-icon"/></svg><u></u></button>
      <button class="gbtn dark big skip" id="p-fwd" title="Forward"><svg viewBox="0 0 24 24"><path data-i="fwd"/></svg><b></b></button>
      <button class="gbtn dark" id="p-next" title="Next (N)"><svg viewBox="0 0 24 24"><path data-i="next"/></svg></button>
    </div>

    <div class="ctl panelbar">
      <div class="seekrow">
        <span id="tcur">00:00</span>
        <div id="seek"><div class="tr"><i class="buf"></i><i class="fill"></i></div><span class="th"></span><span class="chip" id="chip">00:00</span></div>
        <span id="trem">-00:00</span>
      </div>
      <div class="btnrow">
        <button id="p-vol" title="Mute (M)"><svg viewBox="0 0 24 24"><path id="vol-icon"/></svg></button>
        <input id="vol" type="range" min="0" max="1" step="0.01">
        <span class="sp"></span>
        <button class="chipbtn" id="p-speed" title="Speed"><svg viewBox="0 0 24 24"><path data-i="speed"/></svg><b id="speed-l">1x</b></button>
        <button id="p-subs" title="Subtitles (C)"><svg viewBox="0 0 24 24"><path data-i="subs"/></svg></button>
        <button id="p-tracks" title="Audio track"><svg viewBox="0 0 24 24"><path data-i="track"/></svg></button>
        <button id="p-more" title="More"><svg viewBox="0 0 24 24"><path data-i="more"/></svg></button>
        <button id="p-full" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><path id="full-icon"/></svg></button>
      </div>
    </div>

    <div id="panel-scrim"></div>
    <aside id="panel"><div class="ph"><b id="panel-title"></b><button class="gbtn dark sm" id="panel-x"><svg viewBox="0 0 24 24"><path data-i="close"/></svg></button></div><div id="panel-body"></div></aside>
  </section>

  <div id="modal" hidden><div class="card-m" id="modal-card"></div></div>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
